version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://get.pnpm.io/install.sh | sh # Install pnpm
        - export PATH="~/.local/share/pnpm:$PATH" # Add pnpm to PATH
        - corepack enable # Ensure corepack is enabled
        - pnpm install
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next # Change based on your framework (e.g., `build` for React, `dist` for Vue)
    files:
      - "**/*"
  cache:
    paths:
      - ~/.pnpm-store # Cache pnpm dependencies
      - node_modules/**/*
